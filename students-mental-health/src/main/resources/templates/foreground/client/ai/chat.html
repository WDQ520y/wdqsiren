<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<div th:replace="foreground/client/header::header(AI心理助手,null)"></div>

<style>
.chat-container {
    width: 900px;
    margin: 20px auto;
    background: #f5f7fa;
    border-radius: 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    height: 700px;
    overflow: hidden;
}
.chat-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.chat-header h3 { margin: 0; font-size: 18px; }
.chat-header .clear-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
}
.chat-header .clear-btn:hover { background: rgba(255,255,255,0.35); }
.chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}
.msg-row { display: flex; margin-bottom: 18px; align-items: flex-start; }
.msg-row.user { justify-content: flex-end; }
.avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    margin: 0 10px;
}
.msg-row.assistant .avatar { background: #e8e0f5; }
.msg-row.user .avatar { background: #e0e8f5; order: 2; }
.msg-content { max-width: 70%; }
.bubble {
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
}
.msg-row.assistant .bubble {
    background: #fff;
    color: #333;
    border-top-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.msg-row.user .bubble {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border-top-right-radius: 4px;
}
.chat-input {
    padding: 16px;
    background: #fff;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
}
.chat-input textarea {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 10px 14px;
    resize: none;
    height: 44px;
    font-size: 14px;
    outline: none;
}
.chat-input textarea:focus { border-color: #667eea; }
.chat-input button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 24px;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}
.chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
.typing {
    display: inline-block;
    width: 8px; height: 8px;
    background: #999;
    border-radius: 50%;
    margin-right: 4px;
    animation: blink 1.4s infinite both;
}
.typing:nth-child(2) { animation-delay: 0.2s; }
.typing:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100% { opacity: 0.3; } 40% { opacity: 1; } }
.disclaimer {
    text-align: center;
    font-size: 12px;
    color: #999;
    padding: 8px;
    background: #fffbe6;
}
</style>

<div class="chat-container">
    <div class="chat-header">
        <h3>AI心理陪伴助手</h3>
        <button class="clear-btn" onclick="clearChat()">清空对话</button>
    </div>
    <div class="disclaimer">本助手为AI程序，不能替代专业心理咨询或医疗诊断</div>
    <div class="chat-messages" id="chatBox">
        <div class="msg-row assistant">
            <div class="avatar">🤖</div>
            <div class="msg-content">
                <div class="bubble">你好！我是你的AI心理陪伴助手。😊

我可以陪你聊聊心情、压力、人际关系等话题。我会认真倾听，也会基于心理学知识给你一些建议。

请记住：我不是医生，不能替代专业诊断。如果你正经历严重困扰，请拨打全国心理援助热线 400-161-9995。

今天想聊点什么呢？</div>
            </div>
        </div>
        <div th:each="msg : ${history}" th:classappend="${msg.role == 'user'} ? 'msg-row user' : 'msg-row assistant'">
            <div class="avatar" th:text="${msg.role == 'user'} ? '👤' : '🤖'">🤖</div>
            <div class="msg-content">
                <div class="bubble" th:text="${msg.content}"></div>
            </div>
        </div>
    </div>
    <div class="chat-input">
        <textarea id="msgInput" placeholder="写下你的心情..." onkeydown="if(event.keyCode===13&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
        <button id="sendBtn" onclick="sendMsg()">发送</button>
    </div>
</div>

<th:block th:include="include :: footer"/>
<script th:inline="javascript">
var ctx = [[${#httpServletRequest.getContextPath()}]];

function sendMsg() {
    var input = document.getElementById('msgInput');
    var msg = input.value.trim();
    if (!msg) return;
    var sendBtn = document.getElementById('sendBtn');
    sendBtn.disabled = true;

    appendMsg('user', msg);
    input.value = '';

    var typingId = 'typing_' + Date.now();
    var box = document.getElementById('chatBox');
    box.insertAdjacentHTML('beforeend',
        '<div class="msg-row assistant" id="' + typingId + '"><div class="avatar">🤖</div><div class="msg-content"><div class="bubble"><span class="typing"></span><span class="typing"></span><span class="typing"></span></div></div></div>');
    box.scrollTop = box.scrollHeight;

    $.ajax({
        url: ctx + '/system/ai/send',
        type: 'post',
        contentType: 'application/json',
        data: JSON.stringify({message: msg}),
        success: function(result) {
            $('#' + typingId).remove();
            if (result.data) {
                appendMsg('assistant', result.data.reply);
                if (result.data.crisis === 'HIGH') {
                    setTimeout(function(){
                        alert('⚠️ 你现在可能面临紧急情况，请立即拨打：\n\n全国心理援助热线：400-161-9995\n学校心理中心电话：{{校心理中心电话}}\n紧急情况：110 / 120\n\n你不是一个人，现在就联系信任的人吧。');
                    }, 500);
                }
            }
            sendBtn.disabled = false;
            input.focus();
        },
        error: function() {
            $('#' + typingId).remove();
            appendMsg('assistant', '抱歉，出了点问题，请稍后再试。');
            sendBtn.disabled = false;
        }
    });
}

function appendMsg(role, content) {
    var box = document.getElementById('chatBox');
    var cls = role === 'user' ? 'msg-row user' : 'msg-row assistant';
    var avatar = role === 'user' ? '👤' : '🤖';
    var safeContent = content.replace(/</g,'&lt;');
    box.insertAdjacentHTML('beforeend',
        '<div class="' + cls + '"><div class="avatar">' + avatar + '</div><div class="msg-content"><div class="bubble">' + safeContent + '</div></div></div>');
    box.scrollTop = box.scrollHeight;
}

function clearChat() {
    if (!confirm('确定清空所有对话记录吗？')) return;
    $.post(ctx + '/system/ai/clear', function() {
        location.reload();
    });
}
</script>
</body>
</html>
