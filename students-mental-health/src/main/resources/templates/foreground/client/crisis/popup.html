<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<div th:fragment="body">
<style>
#crisisOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.55);
    z-index: 999999999;
    justify-content: center;
    align-items: center;
}
#crisisCard {
    background: #fff;
    border-radius: 16px;
    width: 420px;
    max-width: 90%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
#crisisBodyArea {
    padding: 36px 32px 28px;
    text-align: center;
}
#crisisBodyArea p {
    margin: 0 0 20px;
    font-size: 17px;
    line-height: 1.75;
    color: #333;
    text-align: left;
}
#crisisSignature {
    font-size: 15px;
    color: #888;
    text-align: right;
    margin-bottom: 24px !important;
}
#crisisLink {
    display: inline-block;
    color: #4A90D9;
    font-size: 16px;
    text-decoration: none;
    border: none;
    background: none;
    cursor: pointer;
    padding: 8px 0;
}
#crisisLink:hover { opacity: 0.8; }
#crisisBtns {
    display: flex;
    border-top: 1px solid #eee;
}
#crisisBtns button {
    flex: 1;
    padding: 16px 0;
    font-size: 17px;
    border: none;
    background: #fff;
    cursor: pointer;
}
#crisisPrimaryBtn {
    color: #333;
    border-right: 1px solid #eee;
}
#crisisSecondaryBtn {
    color: #e74c3c;
}
#crisisBtns button:active { background: #f5f5f5; }
</style>

<div id="crisisOverlay">
    <div id="crisisCard">
        <div id="crisisBodyArea">
            <p id="crisisText"></p>
            <p id="crisisSignature">——默默关心你的心理老师</p>
            <a id="crisisLink" href="javascript:showHotline()">📞 心理危机援助 ›</a>
        </div>
        <div id="crisisBtns">
            <button id="crisisPrimaryBtn" onclick="crisisAction()">我知道了</button>
            <button id="crisisSecondaryBtn" onclick="closeCrisis()">继续浏览</button>
        </div>
    </div>
</div>

<script>
var crisisTemplates = {
    HIGH_A: {
        text: "看起来你现在很难受，谢谢你愿意把这些说出来。如果你正被强烈的痛苦包围，可以拨打 {{全国心理援助热线}}，也可以联系校心理中心 {{校心理中心电话}}。这都是免费且保密的。",
        primary: "拨打热线"
    },
    HIGH_B: {
        text: "你现在的感受我们听到了，痛苦是真的，但你不必独自扛着。请拨打 {{全国心理援助热线}}，或来 {{地址}} 找我们聊聊。咨询免费、保密。",
        primary: "预约咨询"
    },
    MEDIUM: {
        text: "听起来你最近情绪很低落，如果你想找人聊聊，可以拨打 {{全国心理援助热线}}，或联系校心理中心 {{校心理中心电话}}。免费且保密。",
        primary: "了解一下"
    }
};

window.showCrisisModal = function(level, templateId) {
    var tpl = crisisTemplates[templateId] || crisisTemplates.HIGH_A;
    document.getElementById('crisisText').textContent = tpl.text;
    document.getElementById('crisisPrimaryBtn').textContent = tpl.primary;
    if (window.layer) { try { layer.closeAll(); } catch(e){} }
    document.getElementById('crisisOverlay').style.display = 'flex';
};

window.closeCrisis = function() {
    document.getElementById('crisisOverlay').style.display = 'none';
};

window.crisisAction = function() {
    window.open('tel:{{全国心理援助热线}}', '_self');
    closeCrisis();
};

window.showHotline = function() {
    alert('全国心理援助热线：{{全国心理援助热线}}\n校心理中心：{{校心理中心电话}}\n地址：{{地址}}\n（请替换为真实信息）');
};

// 监听 AJAX 响应中的危机标记（兜底）
$(document).ajaxComplete(function(event, xhr, settings) {
    if (xhr.responseJSON) {
        var r = xhr.responseJSON;
        if (r.msg === 'CRISIS_BLOCK' || r.msg === 'CRISIS_WARN') {
            var tplId = r.templateId === 'HIGH' ? 'HIGH_A' : 'MEDIUM';
            showCrisisModal(r.crisisLevel, tplId);
        }
    }
});
</script>
</div>
</body>
</html>
