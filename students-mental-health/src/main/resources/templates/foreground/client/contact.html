<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<div th:replace="foreground/client/header::header(联系我们,null)"></div>

<style>
    .contact-wrap {
        width: 1000px;
        margin: 30px auto;
        background: #fff;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .contact-wrap h2 {
        color: #333;
        border-left: 4px solid #30b869;
        padding-left: 12px;
        margin-bottom: 30px;
    }
    .contact-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 25px;
    }
    .contact-item .icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #e8f5e9;
        color: #30b869;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-right: 16px;
        flex-shrink: 0;
    }
    .contact-item .label {
        font-weight: bold;
        color: #555;
        margin-bottom: 4px;
    }
    .contact-item .value {
        color: #666;
        line-height: 1.6;
    }
    .contact-divider {
        border: none;
        border-top: 1px dashed #e0e0e0;
        margin: 25px 0;
    }
</style>

<div class="contact-wrap">
    <h2>联系我们</h2>

    <div class="contact-item">
        <div class="icon">电话</div>
        <div>
            <div class="label">心理咨询热线</div>
            <div class="value">{{校心理中心电话}}<br/>全国24小时心理援助热线：400-161-9995</div>
        </div>
    </div>

    <hr class="contact-divider"/>

    <div class="contact-item">
        <div class="icon">地点</div>
        <div>
            <div class="label">心理咨询中心地址</div>
            <div class="value">{{地址}}<br/>工作日 8:30 - 17:30 开放</div>
        </div>
    </div>

    <hr class="contact-divider"/>

    <div class="contact-item">
        <div class="icon">邮箱</div>
        <div>
            <div class="label">心理中心邮箱</div>
            <div class="value">{{心理中心邮箱}}</div>
        </div>
    </div>

    <hr class="contact-divider"/>

    <div class="contact-item">
        <div class="icon">微信</div>
        <div>
            <div class="label">关注心理中心公众号</div>
            <div class="value">搜索学校心理健康教育中心微信公众号<br/>获取更多心理调适资源与活动信息</div>
        </div>
    </div>
</div>

<th:block th:include="include :: footer"/>
</body>
</html>
