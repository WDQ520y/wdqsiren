<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<th:block th:include="include :: header('AI对话记录')"/>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="ibox">
        <div class="ibox-title"><h5>AI对话记录</h5></div>
        <div class="ibox-content">
            <table class="table table-striped table-bordered">
                <thead><tr>
                    <th>ID</th><th>用户</th><th>角色</th><th>内容</th><th>情绪</th><th>危机等级</th><th>时间</th>
                </tr></thead>
                <tbody>
                    <tr th:each="m : ${records}">
                        <td th:text="${m.id}"></td>
                        <td th:text="${m.userName}"></td>
                        <td th:text="${m.role == 'user' ? '用户' : 'AI'}"></td>
                        <td th:text="${m.content}"></td>
                        <td th:text="${m.emotion}"></td>
                        <td th:text="${m.crisisLevel}"></td>
                        <td th:text="${m.createTime}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
</body>
</html>
